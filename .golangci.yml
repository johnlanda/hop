# golangci-lint configuration for HOP. The schema is the v2 schema of the
# golangci-lint version pinned in the Makefile; `make lint` validates this file
# against it before linting. Only the linters listed under `enable` run.
#
# There are no path-wide exclusions. A finding that is a false positive at one
# site is suppressed at that site with a `//nolint:<linter> // <invariant>`
# comment naming the linter and the invariant that makes the site acceptable.
version: "2"

run:
  # Analyze test files together with production files.
  tests: true
  modules-download-mode: readonly

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/johnlanda/hop
      extra:
        group-params: true
        clothe-returns: true
    goimports:
      local-prefixes:
        - github.com/johnlanda/hop

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    govet:
      enable:
        - nilness
        - shadow
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: comment-spacings
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: identical-branches
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: unused-receiver
        - name: use-any
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
